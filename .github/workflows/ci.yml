name: CI

# Lint, formatting and tests only. Platform builds and packaging happen locally (`task release`).
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Our Go packages. Not `./...`: that walks into frontend/node_modules.
  GO_PKGS: . ./app/... ./internal/...
  # Latest patch of this minor, so the standard library carries the current security fixes.
  GO_VERSION: '1.27'

jobs:
  go:
    name: Go
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
      # The Wails packages need the webview headers to compile, even for tests.
      - name: Linux webview libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-dev libwebkit2gtk-4.1-dev libgtk-4-dev libwebkitgtk-6.0-dev
      # main.go embeds frontend/dist; a placeholder is enough to compile and test the Go side.
      - name: Placeholder frontend/dist
        run: mkdir -p frontend/dist && echo '<!doctype html>' > frontend/dist/index.html
      - name: Install golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15
          install-only: true
      - name: Formatting (gofumpt)
        run: golangci-lint fmt --diff
      - name: golangci-lint
        run: golangci-lint run $GO_PKGS
      - name: go vet
        run: go vet $GO_PKGS
      - name: go test
        run: go test -race $GO_PKGS

  frontend:
    name: Frontend
    runs-on: ubuntu-26.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Prettier
        run: npm run format:check
      - name: ESLint
        run: npm run lint
      - name: Unit tests
        run: npm run test:ci
      - name: Storybook tests
        run: |
          npx playwright install --with-deps chromium
          npm run test-storybook
