name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Our Go packages. Not `./...`: that walks into frontend/node_modules.
  GO_PKGS: . ./app/... ./internal/...
  # Latest patch of this minor, so the standard library carries the current security fixes.
  GO_VERSION: '1.27'
  WAILS_VERSION: v3.1.0

jobs:
  go:
    name: Go (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
      - name: Linux webview libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-dev libwebkit2gtk-4.1-dev libgtk-4-dev libwebkitgtk-6.0-dev
      # main.go embeds frontend/dist. The frontend job builds the real thing; a placeholder is enough
      # to compile and test the Go side here.
      - name: Placeholder frontend/dist
        shell: bash
        run: mkdir -p frontend/dist && echo '<!doctype html>' > frontend/dist/index.html
      - name: Install golangci-lint
        if: runner.os == 'Linux'
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.15
          install-only: true
      - name: Formatting (gofumpt)
        if: runner.os == 'Linux'
        run: golangci-lint fmt --diff
      - name: golangci-lint
        if: runner.os == 'Linux'
        run: golangci-lint run $GO_PKGS
      - name: go vet
        shell: bash
        run: go vet $GO_PKGS
      - name: go test
        shell: bash
        # -race needs cgo, which the Windows runner's default toolchain setup doesn't give us.
        run: go test ${{ runner.os != 'Windows' && '-race' || '' }} $GO_PKGS
      - name: go build
        shell: bash
        run: go build -o "$RUNNER_TEMP/worklogger" .

  govulncheck:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgtk-3-dev libwebkit2gtk-4.1-dev libgtk-4-dev libwebkitgtk-6.0-dev
      - run: mkdir -p frontend/dist && echo '<!doctype html>' > frontend/dist/index.html
      - run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - run: govulncheck $GO_PKGS

  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Prettier
        run: npm run format:check
      - run: npm run lint
      - run: npm run test:ci
      - run: npm run build
      - name: Storybook tests
        run: |
          npx playwright install --with-deps chromium
          npm run test-storybook

  bindings:
    name: Bindings are up to date
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
      - run: go install github.com/wailsapp/wails/v3/cmd/wails3@${{ env.WAILS_VERSION }}
      - run: mkdir -p frontend/dist && echo '<!doctype html>' > frontend/dist/index.html
      # Same command as `task bindings`.
      - run: wails3 generate bindings -clean=true -ts -i
      - name: Fail on a diff
        run: |
          git status --porcelain frontend/bindings
          test -z "$(git status --porcelain frontend/bindings)" || {
            echo "::error::frontend/bindings is stale. Run 'task bindings' and commit the result."
            git diff --stat frontend/bindings
            exit 1
          }
