name: Tests

on:
  pull_request:

jobs:
  test:
    # macOS 26 + Xcode 26: the app uses Liquid Glass and SwiftUI's WebKit API.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - name: Style (swift-format, .swift-format)
        run: swift format lint --strict --recursive --parallel Sources Tests Packages/WorkLoggerKit/Sources Packages/WorkLoggerKit/Tests
      - name: Package tests (Core, Store, Git, Calendar, Tempo, Web)
        run: swift test --package-path Packages/WorkLoggerKit
      - name: App and package tests through the workspace
        run: |
          xcodebuild test \
            -workspace WorkLogger.xcworkspace \
            -scheme WorkLogger \
            -destination 'platform=macOS,arch=arm64' \
            CODE_SIGNING_ALLOWED=NO
