name: Bug report
description: Something doesn't work as it should
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time. Please don't paste tokens, chat text or other private data; the activity
        console masks credentials, but check before you copy from it. Security problems go through SECURITY.md,
        not here.
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. Collect October\n2. Open Review\n3. …"
  - type: input
    id: version
    attributes:
      label: WorkLogger version
      placeholder: "0.1.0"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [macOS, Windows, Linux]
    validations:
      required: true
  - type: checkboxes
    id: modules
    attributes:
      label: Modules involved
      options:
        - label: Repositories (git)
        - label: Meetings (Google Calendar or ICS feed)
        - label: Work sessions (HRmaster)
        - label: Chats (Google Chat)
        - label: Tempo / Jira export
  - type: textarea
    id: activity
    attributes:
      label: Activity console lines (optional)
      description: Status bar → Activity. Remove anything private.
      render: text
