<ng-template snPageCommands>
  @if (days().length) {
    <button
      snCommand
      hideLabel
      icon="phosphorPaperPlaneTilt"
      [label]="'week.send' | t"
      [disabled]="store.busy() || store.locked() || days()[0].day > store.today()"
      (click)="store.sendRange(days()[0].day, days()[6].day)"
    ></button>
  }
  @if (store.modules().includes('chats') && days().length) {
    <button
      snCommand
      hideLabel
      icon="phosphorChats"
      [label]="'week.fetchChat' | t"
      [disabled]="store.busy() || days()[0].day > store.today()"
      (click)="store.run('fetchGoogleChat', { from: days()[0].day, to: days()[6].day })"
    ></button>
  }
</ng-template>

<!-- The week's title and hours are on the header line (providePageHeader). -->
<section class="page" [attr.aria-label]="title()">
  <wl-week-timeline
    class="timeline"
    [days]="days()"
    [logs]="logs()"
    [today]="store.today()"
    (open)="open($event)"
    (openEntry)="open($event.day, $event.id)"
  />
</section>
