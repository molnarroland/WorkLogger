@for (g of groups(); track g.step) {
  <section class="group" [attr.aria-labelledby]="'launcher-' + g.step">
    <h3 class="section-title small sn-text-muted" [id]="'launcher-' + g.step">{{ 'step.' + g.step | t }}</h3>
    <ul class="tiles">
      @for (p of g.panes; track p.id) {
        @let on = pinned().includes(p.id);
        <li class="tile" [class.current]="p.id === current()">
          <button
            type="button"
            class="open"
            [attr.aria-current]="p.id === current() ? 'page' : null"
            (click)="go(p.id)"
          >
            <ng-icon [name]="p.icon" aria-hidden="true" />
            <span class="label">{{ p.label | t }}</span>
          </button>
          <button
            type="button"
            class="pin"
            [class.on]="on"
            [attr.aria-pressed]="on"
            [attr.aria-label]="(on ? 'nav.unpin' : 'nav.pin') | t: { page: (p.label | t) }"
            [snTooltip]="(on ? 'nav.unpin' : 'nav.pin') | t: { page: (p.label | t) }"
            (click)="togglePin.emit(p.id)"
          >
            <ng-icon name="lucidePin" aria-hidden="true" />
          </button>
        </li>
      }
    </ul>
  </section>
}
<p class="hint small sn-text-muted">{{ 'nav.pinHint' | t }}</p>
