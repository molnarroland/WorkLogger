version: '3'

vars:
  APP_NAME: "WorkLogger"
  BIN_DIR: "bin"
  PACKAGE_MANAGER: "npm"
  # Angular dev server port; `wails3 dev -port` points the window at it.
  VITE_PORT: '{{.WAILS_VITE_PORT | default 4200}}'
  GOOS: '{{.GOOS | default OS}}'
  # Our Go packages. Not `./...`: that walks into frontend/node_modules (some npm packages ship Go files).
  GO_PKGS: . ./app/... ./internal/...

includes:
  common: ./build/Taskfile.yml
  windows: ./build/windows/Taskfile.yml
  darwin: ./build/darwin/Taskfile.yml
  linux: ./build/linux/Taskfile.yml

tasks:
  # A fresh clone can't compile Go until frontend/dist exists (main.go embeds it), so every Go task below
  # builds the frontend first. `task check` is what CI runs.

  check:
    summary: Formatting check, lint and tests, in the order CI runs them
    cmds:
      - task: fmt:check
      - task: lint
      - task: test

  test:
    summary: Go tests (with -race) and the frontend unit tests
    deps: [common:build:frontend]
    cmds:
      - go test -race {{.GO_PKGS}}
      - npm --prefix frontend run test:ci

  lint:
    summary: go vet, golangci-lint and ESLint
    deps: [common:build:frontend]
    cmds:
      - go vet {{.GO_PKGS}}
      - golangci-lint run {{.GO_PKGS}}
      - npm --prefix frontend run lint

  fmt:
    summary: Formats Go (gofumpt) and the frontend (Prettier)
    deps: [common:install:frontend:deps]
    cmds:
      - golangci-lint fmt
      - npm --prefix frontend run format

  fmt:check:
    summary: Fails if anything is not formatted
    deps: [common:install:frontend:deps]
    cmds:
      - golangci-lint fmt --diff
      - npm --prefix frontend run format:check

  fixtures:
    summary: Regenerates the frontend's story data from the Go views (commit the result)
    cmds:
      - go test ./app -run TestStoryFixtures -update

  bindings:
    summary: Regenerates the TypeScript bindings in frontend/bindings (commit the result)
    cmds:
      - task: common:generate:bindings

  build:
    summary: Builds the application
    cmds:
      - task: "{{.GOOS}}:build"

  package:
    summary: Packages a production build of the application
    cmds:
      - task: "{{.GOOS}}:package"

  run:
    summary: Runs the application
    cmds:
      - task: "{{.GOOS}}:run"

  dev:
    summary: Runs the application in development mode
    cmds:
      - wails3 dev -config ./build/config.yml -port {{.VITE_PORT}}

  release:
    summary: Builds the release files into bin/release (run on macOS, with Docker and the wails-cross-amd64 image)
    desc: |
      bin/release/WorkLogger-<version>-windows-amd64.zip    WorkLogger.exe, zipped
      bin/release/WorkLogger-<version>-macos-arm64.dmg      the Apple silicon (arm64) .app
      bin/release/WorkLogger-<version>-linux-amd64          the binary, compressed with UPX
      bin/release/SHA256SUMS.txt                            their checksums
      The version is the one in build/config.yml. Nothing is code-signed.
    platforms: [darwin] # the DMG needs macOS's hdiutil and codesign
    preconditions:
      - sh: command -v zip
        msg: zip is needed for the Windows archive
      - sh: command -v upx
        msg: 'UPX is needed for the Linux binary: brew install upx'
      - sh: docker image inspect wails-cross-amd64 > /dev/null 2>&1
        msg: 'The amd64 Docker image for the Linux build is missing: task setup:docker:amd64'
    vars:
      VERSION:
        sh: sed -n 's/^ *version:[[:space:]]*"\([^"]*\)".*/\1/p' build/config.yml | head -1
      OUT: '{{.BIN_DIR}}/release'
      NAME: '{{.APP_NAME}}-{{.VERSION}}'
    # One after the other, not as deps: the macOS and Linux builds both write bin/WorkLogger by default.
    cmds:
      - rm -rf "{{.OUT}}" && mkdir -p "{{.OUT}}"
      # Windows: pure Go, cross-compiles without cgo.
      - task: windows:build
        vars: { ARCH: amd64 }
      - zip -j -9 "{{.OUT}}/{{.NAME}}-windows-amd64.zip" "{{.BIN_DIR}}/{{.APP_NAME}}.exe"
      # macOS: Apple silicon .app, ad-hoc signed, in a DMG.
      - task: darwin:build
        vars: { ARCH: arm64 }
      - task: darwin:create:app:bundle
      - task: darwin:create:dmg
      - mv "{{.BIN_DIR}}/{{.APP_NAME}}.dmg" "{{.OUT}}/{{.NAME}}-macos-arm64.dmg"
      # Linux: cgo (GTK), so it builds in Docker. The image's gcc and GTK libraries are its own architecture,
      # so an amd64 binary needs the amd64 image (emulated on Apple silicon; see setup:docker:amd64).
      - task: linux:build
        vars: { ARCH: amd64, OUTPUT: '{{.OUT}}/{{.NAME}}-linux-amd64', CROSS_IMAGE: wails-cross-amd64 }
      - upx --best --lzma "{{.OUT}}/{{.NAME}}-linux-amd64"
      - cd "{{.OUT}}" && shasum -a 256 {{.NAME}}-* > SHA256SUMS.txt
      - ls -lh "{{.OUT}}"

  install:msix:tools:
    summary: Installs tools required for Windows MSIX packaging
    cmds:
      - task: windows:install:msix:tools

  setup:docker:
    summary: Builds Docker image for cross-compilation (~800MB download)
    cmds:
      - task: common:setup:docker

  setup:docker:amd64:
    summary: Builds the amd64 cross-compilation image that `task release` uses for the Linux binary
    cmds:
      - docker build --platform linux/amd64 -t wails-cross-amd64 -f build/docker/Dockerfile.cross build/docker/
